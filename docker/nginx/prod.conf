# =============================================================================
# prod.conf = 本番のNginxの設定(HTTPのまま動かす用)
#
#   Nginx を Django(gunicorn)の前に置く理由は、CSSや画像を渡すだけの仕事を
#   Django から引き取るため。お店でいう入口の案内係。
#
#   ▼ ★設定は2枚あり、compose.prod.yml でどちらを使うか選ぶ
#
#       prod.conf        … HTTPのまま(このファイル)。まずこちら
#       prod-https.conf  … 証明書を取った後
#
#     ★証明書が無い状態でHTTPS版を読ませると Nginx は起動しない。
#       順番は「HTTPで動かす → 証明書を取る → HTTPS版に切り替える」。
#       手順は docs/DEPLOY.md。
#
#   中身の設定(圧縮・CSS・Djangoへの受け渡し)は app.inc にある。
#   直したとき: docker compose -f compose.prod.yml restart nginx
# =============================================================================

server {
    listen 80;

    # _ = どのドメインで来ても受ける。絞るときは app.example.com と書く。
    # ★Django側の DJANGO_ALLOWED_HOSTS も合わせること。
    server_name _;

    # ▼ ★証明書を取る・更新するときの受け渡し場所
    #
    #   証明書の本人確認は「発行元がこのURLを読みに来る」形で行われる。
    #   つまり★証明書を取る作業自体はHTTPで走るので、ここを塞ぐと1枚も取れない。
    #   更新のたびに同じ確認があるため、HTTPS版にも同じ設定が入っている。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/app.inc;
}
