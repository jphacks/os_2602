# =============================================================================
# prod-https.conf = 本番のNginxの設定(証明書を取った後。鍵マークが付く)
#
#   ★証明書が無い状態でこれを読ませると Nginx は起動しない。
#     最初は prod.conf(HTTP版)で動かすこと。
#
#   切り替えは compose.prod.yml のマウント1行を prod-https.conf に変えるだけ。
#   手順の全体は docs/DEPLOY.md。
#
#   ▼ server が2つある理由
#
#     ★80番(HTTP)を閉じてはいけない。ブラウザは何も指定がなければ
#       まずHTTPで訪ねてくるので、閉じるとサイトが消えたように見える。
#
#       80番  … 「HTTPSのほうへどうぞ」と案内するだけ
#       443番 … 本体。サイトの中身はすべてこちら
#
#   中身の設定(圧縮・CSS・Djangoへの受け渡し)は app.inc にある。
# =============================================================================

# --- 80番 = 案内係 ---
server {
    listen 80;
    server_name _;

    # ★更新確認だけはHTTPのまま応答する必要がある。
    #   下のリダイレクトより後ろに書くと更新に失敗し、しかも3か月後に
    #   「急にサイトが警告だらけ」という形で出るので原因に辿り着きにくい。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 443番 = 本体 ---
server {
    # ★nginx 1.25.1 以降は `listen 443 ssl http2;` と1行に書くと警告が出る。
    #   http2 は別の行に分けるのが今の正しい書き方(古い記事が多いので注意)。
    listen 443 ssl;
    http2 on;

    # ★HTTPSにしたら DJANGO_CSRF_TRUSTED_ORIGINS に https://自分のドメイン を入れること。
    #   入れないとフォームの送信が全部403で弾かれる(画面に理由は出ない)。
    server_name _;

    # ★example.com を自分のドメインに書き換えること。
    #   書き換え忘れが、HTTPS化でいちばん多いつまずき。
    #   privkey.pem は秘密の鍵。絶対に外に出さない・Gitに入れない。
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # ★TLSv1.0 / 1.1 には弱点があるので1.2以上に絞る。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ▼ HSTS = 「今後HTTPSでしか開くな」とブラウザに覚えさせる
    #
    #   ★一度覚えさせると1年間取り消せない。その間に証明書が切れると
    #     サイトが完全に開けなくなり、HTTPに戻して直すこともできない。
    #     自動更新が実際に回ったのを確かめてから外すこと。急ぐ理由はない。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/app.inc;
}
