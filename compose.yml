# =============================================================================
# compose.yml = アプリとDBをまとめて動かす段取り表
#
#   Dockerfile  = 箱1つの作り方
#   compose.yml = 箱を複数まとめて動かす段取り(+ どうつなぐか)
#
#   ▼ 使うコマンドは実質これだけ
#       docker compose up          起動(ログが流れる。Ctrl+Cで停止)
#       docker compose up -d       起動(裏で動かす)
#       docker compose down        停止
#       docker compose logs -f web アプリのログを見る
#
#   ★ポート番号について
#     Flask版・Gin版と同時に起動しても衝突しないよう、番号をずらしてある。
#         Flask版  … アプリ 5000 / DB 3307
#         Gin版    … アプリ 8080 / DB 3308
#         Django版 … アプリ 8000 / DB 3309
# =============================================================================

services:
  # ===========================================================================
  # db = MySQL
  # ===========================================================================
  db:
    # 公式の完成品を借りる。
    # ★latest にすると勝手に新しい版になって壊れるので番号で固定する。
    image: mysql:8.4

    # PCがスリープしてDBが落ちても自動で復帰する。
    restart: unless-stopped

    environment:
      # ${...} は .env の値を差し込む指定。
      # パスワードをこのファイルに直接書かないのでGitHubに上げても安全。
      # ★この4つはMySQLの箱が理解する決まった名前(自由には変えられない)。
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME} # 初回起動時にこの名前のDBを自動で作る
      MYSQL_USER: ${DB_USER} # アプリ用ユーザーも自動で作られる
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo # これが無いと保存時刻が9時間ずれる

    ports:
      # "自分のPC側:箱の中側"
      #
      # ★左を 3309 にしているのは、PCのMySQLや他のテンプレートのDBと
      #   番号がぶつからないようにするため。
      # ★DBeaverから繋ぐときはこの 3309 を使う(接続情報は docs/SETUP.md)。
      #   アプリがDBに繋ぐのにこの設定は不要(下の DB_HOST 参照)。
      - "3309:3306"

    volumes:
      # 箱の中身は箱を捨てると消える。DBのデータを箱の外の保管庫に置くことで、
      # docker compose down してもデータが生き残る。
      - db_data:/var/lib/mysql

    healthcheck:
      # ★これが無いと必ずハマる
      #   MySQLは起動命令から実際に使えるまで10〜30秒かかる。その間に
      #   アプリが接続すると「DBに繋がりません」で落ちる。
      #   本当に使える状態になったかを確認するのがこれ。
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s # 最初の40秒は失敗をカウントしない(起動中なので)

  # ===========================================================================
  # web = Django
  # ===========================================================================
  web:
    build:
      # 自分たちのアプリなので、借り物ではなく Dockerfile から作る。
      context: .
      # ★Dockerfile には箱が3つ書いてあるので、どれを使うか指定する。
      #   dev = 保存すると自動で再起動してくれる開発用の箱。
      target: dev

    restart: unless-stopped

    # .env の内容を箱の中に渡す。だから settings.py が os.getenv() で読める。
    env_file:
      - .env

    environment:
      # ★Dockerの便利な仕組み
      #   DB_HOST に "db" と書くだけで上の db の箱に繋がる。
      #   Dockerがサービス名の電話帳を自動で作るので、IPやポートは不要。
      DB_HOST: db

    # ★起動時に migrate → runserver の順で実行する。
    #   毎回 migrate するので「表を作るコマンド」を手で打つ必要がない。
    #   既にある表はそのままなのでデータは消えない。
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

    ports:
      # http://localhost:8000 でアプリが見える。
      - "8000:8000"

    volumes:
      # ★開発でいちばん重要な1行
      #   自分のPCのフォルダと箱の中を直結させることで、
      #   保存 → 即反映 → 自動再起動 になる。
      #   これが無いと1文字直すたびに build が必要になる。
      #   部品を /opt/venv に置いているのはこの行で消されないようにするため。
      - .:/app

    depends_on:
      db:
        # ★service_started(起動しただけ)ではなく
        #   service_healthy(本当に使える状態)を待つ。
        #   これが無いと初回起動時に必ずDB接続エラーになる。
        condition: service_healthy

# =============================================================================
# 箱の外に置く保管庫の宣言。
#   docker compose down -v で保管庫ごと消える(=DBのデータが全部消える)。
#   DBの調子がおかしいときの最終手段。
# =============================================================================
volumes:
  db_data:
