<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dether 測定テスト</title>
<!--
  測定（①）の動作確認ページ。本番の画面ではない。
  開き方：開発中は  http://localhost:8000/static/measure-test.html
          スマホは  cloudflared tunnel --url http://localhost:8000 で出たURLの /static/measure-test.html
  ★スマホのマイクは https でないと使えない。
  ★「サーバーに送る」を使うときは、先に同じURLでアプリのページを1度開いておく（整理券のCookieができる）。
-->
<style>
  :root { --bg:#F1E9D2; --ink:#243B35; --ink2:rgba(36,59,53,.72); --line:rgba(36,59,53,.14); --accent:#6B8E7B; --mist:#B7C9B1;
    --card:rgba(250,246,233,.7); --warn:#8F4630; --warn-bg:rgba(164,85,58,.12); }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d2f2a; --ink:#F1E9D2; --ink2:rgba(241,233,210,.75); --line:rgba(241,233,210,.16);
    --accent:#B7C9B1; --card:rgba(241,233,210,.06); --warn:#F0B79D; --warn-bg:rgba(226,150,120,.14); } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif; }
  main { max-width:480px; margin:0 auto; padding:16px 16px 40px; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:18px; margin:4px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .sub { font-size:12px; color:var(--ink2); }
  .big { font-size:64px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .big small { font-size:18px; font-weight:600; margin-left:4px; color:var(--ink2); }
  .bar { height:8px; border-radius:999px; background:var(--line); overflow:hidden; }
  .bar > span { display:block; height:100%; width:0; background:var(--accent); transition:width .1s linear; }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; text-align:center; }
  .grid div { border:1px solid var(--line); border-radius:12px; padding:6px 4px; }
  .grid b { display:block; font-size:18px; font-variant-numeric:tabular-nums; }
  button { font:inherit; font-weight:700; border:none; border-radius:14px; min-height:48px; padding:0 18px; cursor:pointer; }
  .primary { background:var(--ink); color:var(--bg); flex:1; }
  .ghost { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  label { display:flex; align-items:center; gap:8px; font-size:14px; }
  select, input[type=number] { font:inherit; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); min-height:40px; }
  input[type=number] { width:96px; }
  input[type=range] { flex:1; }
  .notice { border-radius:12px; padding:10px 12px; font-size:14px; font-weight:700; }
  .notice.info { background:rgba(107,142,123,.16); }
  .notice.warn { background:var(--warn-bg); color:var(--warn); }
  [hidden] { display:none !important; }
  ol.log { margin:0; padding-left:20px; font-size:13px; font-variant-numeric:tabular-nums; }
  ol.log li { padding:3px 0; border-bottom:1px dashed var(--line); }
  .state { font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; background:var(--line); }
  .scrim { position:fixed; inset:0; background:rgba(20,32,28,.45); display:flex; align-items:flex-end; justify-content:center; padding:12px; z-index:10; }
  .sheet { width:100%; max-width:456px; background:var(--bg); border-radius:26px; padding:20px; display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center; }
  .coin { width:110px; height:110px; border-radius:50%; display:grid; place-items:center; font-size:34px; font-weight:800; background:var(--mist); color:#243B35; box-shadow:inset 0 0 0 10px rgba(255,255,255,.5); }
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <h1>dether 測定テスト</h1>
    <span class="state" id="state">idle</span>
  </div>

  <section class="card">
    <div class="sub" id="phase">調査ボタンを押すと測り始めます</div>
    <div class="big"><span id="db">--</span><small>dB</small></div>
    <div class="bar"><span id="progress"></span></div>
    <div class="grid">
      <div><span class="sub">経過</span><b id="elapsed">0.0 / 10</b></div>
      <div><span class="sub">この区間の平均</span><b id="avg">--</b></div>
      <div><span class="sub">記録した回数</span><b id="count">0</b></div>
    </div>
    <div class="notice info" id="quiet" hidden></div>
    <div class="notice info" id="guide" hidden>音の発生源に近づいてみよう（安全な場所から）</div>
    <div class="notice warn" id="warning" hidden></div>
    <div class="notice warn" id="error" hidden></div>
    <div class="row">
      <button class="primary" id="start">調査する</button>
      <button class="ghost" id="resume" hidden>再開</button>
      <button class="ghost" id="stop" disabled>終える</button>
    </div>
  </section>

  <section class="card">
    <strong>設定</strong>
    <label>音の入力
      <select id="source">
        <option value="mic">マイク</option>
        <option value="sim">シミュレーション（マイクなし）</option>
      </select>
    </label>
    <div id="simbox" class="card" style="padding:10px" hidden>
      <label>場面
        <select id="scene">
          <option value="loud">大きい音（下の値の前後）</option>
          <option value="rise">だんだん大きくなる（誘導の確認）</option>
          <option value="quiet">静か（37dB前後）</option>
          <option value="deep">とても静か（32dB前後）</option>
          <option value="quietbreak">静かだが20秒ごとに物音</option>
        </select>
      </label>
      <label>大きい音の値 <input type="range" id="level" min="55" max="100" value="82"><b id="levelv">82</b></label>
    </div>
    <label>時間の速さ
      <select id="speed">
        <option value="1">等倍（本番と同じ）</option>
        <option value="5">5倍</option>
        <option value="10">10倍（15秒の静寂が1.5秒）</option>
      </select>
    </label>
    <label>補正値 <input type="number" id="cal" step="0.5"> <span class="sub">推定dB = dBFS + 補正値</span></label>
    <label><input type="checkbox" id="send"> サーバーに送る（オフなら手元で判定）</label>
    <label><input type="checkbox" id="loc" checked> 位置情報を使う（オフなら東京駅）</label>
    <p class="sub" style="margin:0">設定は「調査する」を押したときに反映されます。</p>
  </section>

  <section class="card">
    <strong>補正値を決める（騒音計アプリと比べる）</strong>
    <p class="sub" style="margin:0">騒音計アプリと並べて同じ音を10秒測り、アプリの平均値を入れて「計算」を押すと、直前の回の平均から補正値を出します。</p>
    <div class="row">
      <label>アプリの値 <input type="number" id="ref" step="0.1" placeholder="例 62.0"></label>
      <button class="ghost" id="calc">計算</button>
    </div>
    <div class="sub" id="calcout"></div>
  </section>

  <section class="card">
    <strong>記録（新しい順）</strong>
    <ol class="log" id="log" reversed></ol>
  </section>
</main>

<div class="scrim" id="popup" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="バッジ獲得">
    <div class="sub">測定を一時停止中</div>
    <div class="coin" id="coin">80</div>
    <div><div class="sub">バッジ獲得</div><div style="font-size:22px;font-weight:800" id="pname"></div><div class="sub" id="pnote"></div></div>
    <button class="primary" id="close" style="width:100%">閉じて調査を再開</button>
  </div>
</div>

<script src="js/measure.js"></script>
<script>
  // ここから下は「画面側」の役。本番では④の画面がこの役をする。
  const $ = (id) => document.getElementById(id);
  const M = window.DetherMeasure;
  const MARK = { b90: "90", b80: "80", b70: "70", q40: "静", q35: "深" };

  // 端末ごとの補正値は、この端末のブラウザに覚えておく（テスト用の便利機能）
  const store = {
    get(k, d) { try { const v = localStorage.getItem("dether-" + k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("dether-" + k, v); } catch (e) { /* 保存できない環境 */ } },
  };
  $("cal").value = store.get("cal", M.CONFIG.calibration);
  $("cal").addEventListener("change", () => store.set("cal", $("cal").value));
  $("source").addEventListener("change", () => { $("simbox").hidden = $("source").value !== "sim"; });
  $("level").addEventListener("input", () => { $("levelv").textContent = $("level").value; });

  // シミュレーションの音（モックの測定シミュレーションと同じ考え方）
  function makeSimulator() {
    const t0 = performance.now();
    const speed = Number($("speed").value);
    return () => {
      const t = (performance.now() - t0) / 1000 * speed;
      const lv = Number($("level").value);
      const n = (a) => (Math.random() * 2 - 1) * a;
      switch ($("scene").value) {
        case "rise": return lv - 10 + 15 * ((t % 10) / 10) + n(1.5);
        case "quiet": return 37 + n(1.5);
        case "deep": return 32 + n(1.2);
        case "quietbreak": return (t % 20) > 18 ? 55 : 36 + n(1.5);
        default: return lv + 3 * Math.sin(t * 1.7) + n(3);
      }
    };
  }

  let survey = null;
  let lastResult = null;

  function show(id, text) { const el = $(id); el.hidden = !text; if (text) el.textContent = text; }

  $("start").addEventListener("click", () => {
    const sim = $("source").value === "sim";
    survey = new DetherSurvey({
      calibration: Number($("cal").value),
      simulate: sim ? makeSimulator() : undefined,
      send: $("send").checked ? undefined : null,
      useLocation: $("loc").checked,
      timeScale: Number($("speed").value),
    });
    wire(survey);
    show("error", ""); show("warning", "");
    survey.start(); // ★ボタンの処理の中で呼ぶ
  });
  $("stop").addEventListener("click", () => survey && survey.stop());
  $("resume").addEventListener("click", () => survey && survey.resume()); // ★ボタンの処理の中で
  $("close").addEventListener("click", () => { $("popup").hidden = true; survey.resume(); }); // ★ボタンの処理の中で

  $("calc").addEventListener("click", () => {
    const ref = Number($("ref").value);
    if (!lastResult || !ref) { $("calcout").textContent = "先に1回測ってから、アプリの値を入れてください。"; return; }
    const cal = Number($("cal").value);
    const next = Math.round((cal + (ref - lastResult.avgDb)) * 2) / 2;
    $("cal").value = next; store.set("cal", next);
    $("calcout").textContent = `直前の平均 ${lastResult.avgDb} dB とアプリ ${ref} dB の差から、補正値を ${cal} → ${next} にしました。この値を⑥に共有してください。`;
  });

  function wire(s) {
    s.on("state", (e) => {
      const st = e.detail.state;
      $("state").textContent = st;
      const running = !["idle", "stopped"].includes(st);
      $("start").disabled = running;
      $("stop").disabled = !running;
      $("resume").hidden = st !== "interrupted";
      if (st === "interrupted") $("phase").textContent = "中断しました（画面ロックやアプリ切替）。「再開」で続けられます";
      if (st === "stopped") { $("phase").textContent = `調査を終えました（${s.sessionCount}件を記録）`; $("db").textContent = "--"; }
    });
    s.on("level", (e) => {
      const d = e.detail;
      // 大きな数字は「今の音量」（直近1秒のLeq）
      $("db").textContent = Number.isFinite(d.level) ? d.level.toFixed(1) : d.db.toFixed(1);
      $("elapsed").textContent = `${d.elapsed.toFixed(1)} / ${d.target}`;
      $("avg").textContent = Number.isFinite(d.segmentLeq) ? d.segmentLeq.toFixed(1) : "--";
      $("progress").style.width = Math.min(100, d.elapsed / d.target * 100) + "%";
      $("phase").textContent = PHASE[d.mode];
      $("guide").hidden = !(d.guide && d.mode === "loud");
    });
    s.on("judge-start", (e) => show("quiet", `${JUDGE_NAME[e.detail.mode]}の判定を開始（${e.detail.target}秒）`));
    s.on("judge-cancel", (e) => show("quiet", `音量が通常に戻ったので、${JUDGE_NAME[e.detail.mode]}の判定を取り消しました（${e.detail.elapsed.toFixed(1)}秒）`));
    s.on("warning", (e) => {
      show("warning", `大きな音が続いています（${e.detail.db} dB）。長くいると耳を傷めることがあります`);
      setTimeout(() => show("warning", ""), 5000);
    });
    s.on("round", (e) => { lastResult = e.detail.result; });
    s.on("recorded", (e) => {
      $("count").textContent = s.sessionCount;
      addLog(e.detail, e.detail.badge ? `${M.NAMES[e.detail.badge]}（この調査で獲得済み）` : "バッジなし");
    });
    s.on("badge", (e) => {
      $("count").textContent = s.sessionCount;
      const d = e.detail;
      addLog(d, `★${d.name}`);
      $("coin").textContent = MARK[d.badge];
      $("pname").textContent = d.name;
      $("pnote").textContent = `${d.timeBand ? d.timeBand.name : ""}のバッジ` + (d.response.saved ? "として地図に記録しました" : "（保存なしのテスト）");
      $("popup").hidden = false;
    });
    s.on("error", (e) => show("error", e.detail.message));
  }

  const PHASE = {
    normal: "測定中（70dB以上か40dB未満で判定を始めます）",
    loud: "大きい音の判定中（70dB未満が2秒続くと取り消し）",
    quiet: "静寂の判定中（40dBを超えると取り消し）",
    deep: "深い静寂の判定中（35dBを超えると取り消し）",
  };
  const JUDGE_NAME = { loud: "大きい音", quiet: "静寂", deep: "深い静寂" };

  function addLog(d, note) {
    const r = d.result;
    const li = document.createElement("li");
    const t = r.endedAt.toTimeString().slice(0, 8);
    const kind = r.judge ? `${JUDGE_NAME[r.mode]}の判定` : "通常";
    li.textContent = `${t}  [${kind}] 平均 ${r.avgDb} / 最大 ${r.maxDb} dB・${r.durationSeconds}秒 → ${note}`;
    $("log").prepend(li);
  }
</script>
</body>
</html>
